[package]
name = "promptsync"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Encrypted, port-knocked prompt synchronisation between a server and agents"
license = "MIT"
build = "build.rs"

[[bin]]
name = "promptsync"
path = "src/main.rs"

[lib]
name = "promptsync"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
dirs = "5"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
hostname = "0.4"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[build-dependencies]
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Guard against committed secrets
        run: |
          set -euo pipefail
          if git grep -nIE 'open\.feishu\.cn/open-apis/bot/v2/hook/|larksuite\.com/open-apis/bot/v2/hook/' -- . ; then
            echo "::error::A Feishu webhook URL is present in tracked files."
            exit 1
          fi
          if git ls-files | grep -Ei '^(secrets/|config/|.*\.(pem|key|p12|secret)$|.*\.env$)' ; then
            echo "::error::Secret-like files or the personal config directory are tracked."
            exit 1
          fi
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (unit + real UDP end-to-end)
        run: cargo test --all --locked

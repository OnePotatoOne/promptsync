name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Read the version once and make every platform agree on it. Cluster keys
  # are generated by each installation at first start; no secret is compiled
  # into the release artifacts.
  prepare:
    name: prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ -z "$cargo_version" ]]; then
            echo "could not read version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$cargo_version" ]]; then
              echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
              exit 1
            fi
          else
            version="$cargo_version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            ext: ""
          # macOS 14 runners were retired on 2026-11-02; use macOS 15.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            ext: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      # Release assets are the bare executables: no tar.gz, no zip.
      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="promptsync-${VERSION}-${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/promptsync" "dist/$asset"
          chmod +x "dist/$asset"
      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asset = "promptsync-${env:VERSION}-${{ matrix.platform }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/promptsync.exe" "dist/$asset"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptsync-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: dist/promptsync-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: publish github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One cluster secret for the whole workflow run so that every platform of this
  # release can talk to every other one. Nothing fixed is stored in the repo.
  prepare:
    name: prepare secrets
    runs-on: ubuntu-latest
    outputs:
      secret: ${{ steps.secret.outputs.secret }}
    steps:
      - name: Derive cluster secret
        id: secret
        env:
          FROM_REPO: ${{ secrets.PROMPTSYNC_CLUSTER_SECRET }}
        run: |
          set -euo pipefail
          secret="${FROM_REPO:-}"
          if [ -z "$secret" ]; then
            secret="$(openssl rand -hex 32)"
            echo "::notice::PROMPTSYNC_CLUSTER_SECRET is not configured; generated a random secret for this release."
          fi
          secret="$(printf '%s' "$secret" | tr 'A-F' 'a-f' | tr -d '[:space:]')"
          if ! printf '%s' "$secret" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "PROMPTSYNC_CLUSTER_SECRET must be exactly 64 hex characters" >&2
            exit 1
          fi
          echo "::add-mask::$secret"
          printf 'secret=%s\n' "$secret" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: promptsync-linux-x86_64
            ext: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            name: promptsync-linux-x86_64-musl
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: promptsync-linux-aarch64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: promptsync-linux-aarch64-musl
            ext: ""
          - os: macos-14
            target: x86_64-apple-darwin
            name: promptsync-macos-x86_64
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            name: promptsync-macos-aarch64
            ext: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            name: promptsync-windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    env:
      PROMPTSYNC_BUILD_SECRET: ${{ needs.prepare.outputs.secret }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      # Release assets are the bare executables: no tar.gz, no zip.
      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/promptsync" "dist/${{ matrix.name }}"
          chmod +x "dist/${{ matrix.name }}"
      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/promptsync.exe" "dist/${{ matrix.name }}.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: publish github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

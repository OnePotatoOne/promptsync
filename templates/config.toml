# promptsync 个人配置
#
# 这个文件由 `promptsync` 首次启动时从 templates/config.toml 生成到配置目录
# （默认 ./config/）。配置目录整个被 .gitignore 忽略，永远不会提交到 git。
#
# 生成时 {home} / {cindy_root} / {config_dir} 会被替换成本机实际路径。

# 集群口令：首次启动会自动生成一个随机密钥并写回这里，同时打印一次。
# 其他机器首次启动时粘贴同一串密钥；也可以输入同一句口令（任意短语/密码，
# 程序用 PBKDF2 推导密钥），不必是十六进制：
#   promptsync secret --set "同一句口令"
# 也兼容 64 位 hex。留空 = 尚未生成（下次启动会生成）。
cluster_secret = ""

[server]
# 数据端口与敲门端口的绑定地址（敲门成功前数据端口不会绑定）
bind = "0.0.0.0"
# 0 = 由集群密钥推导；显式端口需要 agent 端一致
port = 0
# 敲门端口池：留空 = 由集群密钥推导（12 个）；显式设置时 server 与 agent 必须一致
knock_ports = []
# 敲门通过后允许该 IP 访问数据端口的时长（秒）
gate_ttl_secs = 90
# 完成一次随机敲门的时间窗（秒）
knock_window_secs = 6
max_sessions = 32
# 服务端侧监控 agent 心跳，失联也发飞书
monitor_agents = true
monitor_interval_secs = 5
forget_agent_after_secs = 604800
# server 签名私钥（首次启动 server 自动生成，保密；agent 不需要）。
# agent 用对应的公钥校验每次下发，防止持有集群密钥的其他机器冒充 server。
signing_key = ""

[agent]
# 服务端主机名或 IP
server = "127.0.0.1"
# 0 = 由集群密钥推导；必须与服务端一致
port = 0
# 一般留空；服务端自定义敲门端口池时填写同样的列表
knock_ports = []
# server 公钥（在 server 上运行 `promptsync ports` 查看）。留空 = 首次连接时记住
# server 的公钥（保存在 state/agent-state.json），之后公钥变化一律拒绝同步。
server_public_key = ""
# 轮询间隔（秒）
poll_secs = 10
# 连续失联多少秒后发飞书离线告警
offline_threshold_secs = 120
# 留空 = 使用主机名
agent_id = ""
handshake_timeout_secs = 4
request_timeout_secs = 8
# 敲门随机延迟的基准（毫秒）
knock_interval_ms = 55
# 每次随机选择 knock_min..=knock_max 个端口，顺序与延迟都随机
knock_min = 3
knock_max = 6
# 每个延迟 ±jitter（毫秒），首包也有随机偏移
knock_jitter_ms = 45
# 每轮最多尝试次数（每次都会重新随机敲门）
connect_attempts = 3

[feishu]
# 自建应用（不是群自定义机器人 webhook）。凭据只保存在本机配置目录，绝不提交。
# 首次启动 `promptsync server`（第 4 步）/ `promptsync agent`（第 3 步）
# 的飞书步骤可以一键创建（点链接确认即可），也可以手动粘贴已有应用。
enabled = false
notify_on_recovery = true
timeout_secs = 10
# 未恢复时每隔多少秒重复告警；0 = 每次失联只发一次
repeat_alert_secs = 0

[feishu.app]
# 飞书开放平台 -> 企业自建应用 -> 凭证与基础信息
app_id = ""
app_secret = ""
# 一键创建应用时会自动填入；手动粘贴时绑定后也会写回
owner_open_id = ""
# 测试时可改为本地 mock 地址
api_base = "https://open.feishu.cn"

[feishu.control]
# 服务端轮询绑定私聊的间隔（秒）
poll_secs = 5
# 单条消息内容上限（字节），超过则拒绝覆盖
max_message_bytes = 32768
# 只记录不写入，用于第一次试运行
dry_run = false
# 可选的接收人（飞书邮箱/手机号）；留空 = 自动用应用所有者
bind_contact = ""
# 覆盖时保留多少个 <文件名>.<时间>.bak 备份；0 = 全部保留
keep_backups = 50

[logging]
# 留空 = <配置目录>/logs
dir = ""
level = "info"
max_file_bytes = 5242880
keep_files = 3
stderr = true

[sync]
# 通过飞书维护的那一个文件：<source id>/<相对路径>。
# 留空时服务端首次启动会自动识别唯一的 system_prompt.md 并写回这里。
target = ""
max_bundle_bytes = 1048576
keep_backups = 10
follow_symlinks = false
# 源集合变小（比如只保留一个文件）时，是否删除 agent 上以前同步过的文件。
# 默认 false：只停止管理，不删除用户文件。
delete_removed = false
# 拉取后把同一个 prompt 自动写入本机已安装客户端的全局指令文件（只写已安装的，覆盖前自动备份）：
#   claude      <CLAUDE_CONFIG_DIR|~/.claude>/CLAUDE.md（终端 + Cindy 的 Claude Code 任务）
#   codex       <CODEX_HOME|~/.codex>/AGENTS.md
#   cindy-codex CindyGlobal/codex-home/AGENTS.md（Cindy 的 Codex 任务；不用重启 Cindy）
#   cindy-pi    Cindy 的 Pi 任务（对话 + 项目）。位置由下面的 cindy_pi 决定：
#               新版 Cindy 写 <PI_CODING_AGENT_DIR|~/.pi/agent>/AGENTS.md；
#               旧版 Cindy 写 ~/AGENTS.md，同时让 claude 的 CLAUDE.md 只导入它（@~/AGENTS.md）
#   kimi        <KIMI_CODE_HOME|~/.kimi-code>/AGENTS.md
#   deepseek    <DSH_HOME|~/.dsh>/AGENTS.md
#   gemini      ~/.gemini/GEMINI.md      qwen ~/.qwen/QWEN.md
#   opencode    <XDG_CONFIG_HOME|~/.config>/opencode/AGENTS.md
#   pi          <PI_CODING_AGENT_DIR|~/.pi/agent>/AGENTS.md（独立 Pi；装了 Cindy 时改由 cindy-pi 覆盖）
#   cindy       CindyGlobal/owners/*/bots/cindy-default/SOUL.md（伙伴/IM 对话的身份）
# 旧内容统一备份到 <状态目录>/client-backups/（按内容去重，`promptsync backups` 查看）：
# 原始文件（第一次接管前的内容）永不清理，其他备份每个文件保留 keep_backups 份。
adapt_clients = true
# 额外目标文件（绝对路径或 ~/...），用于上面没覆盖的客户端。
adapt_paths = []
# 不想写的客户端 id，例如不想管理 Cindy 的 Pi 任务：adapt_exclude = ["cindy-pi"]
adapt_exclude = []
# Cindy 的 Pi 任务从哪里读 prompt：
#   "auto"     检查本机 Cindy 应用是否支持 Pi 全局指令目录，自动选择（推荐）
#   "pi-agent" 强制写 <PI_CODING_AGENT_DIR|~/.pi/agent>/AGENTS.md
#   "home"     强制写 ~/AGENTS.md（旧版 Cindy）
# 每个引擎只加载一份 prompt：另一个位置上由 promptsync 写入的旧副本会存入备份库后移走，
# 用户自己写的文件不会动。
cindy_pi = "auto"

# 同步源：bundle 中的路径为 <id>/<相对路径>，所以各机器 home 不同也能对应上。
[[sync.sources]]
id = "cindy-bots"
root = "{cindy_root}"
# 首次启动会自动识别唯一那个非空 prompt，并询问是否只同步它；
# Feishu 控制通道覆盖的就是 sync.target 指向的那一个文件。
globs = ["*/bots/*/system_prompt.md", "*/bots/*/SOUL.md"]

[[sync.sources]]
id = "pi-prompts"
root = "{home}/.pi/agent/prompts"
globs = ["**/*.md"]

[[sync.sources]]
id = "cindy-prompts"
root = "{home}/.cindy/prompts"
globs = ["**/*.md"]

[[sync.sources]]
id = "shared"
root = "{home}/.promptsync/shared"
globs = ["**/*.md"]
